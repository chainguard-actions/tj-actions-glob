name: Test basic glob matching
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          files: |
            **/*.yml
            **/*.yaml
          read-gitignore: "false"

      - name: Assert paths output is non-empty
        env:
          PATHS: ${{ steps.action.outputs.paths }}
          HAS_CUSTOM: ${{ steps.action.outputs.has-custom-patterns }}
        run: |
          echo "paths: $PATHS"
          echo "has-custom-patterns: $HAS_CUSTOM"
          if [ -z "$PATHS" ]; then
            echo "FAIL: expected paths output to be non-empty"
            exit 1
          fi
          if [ "$HAS_CUSTOM" != "true" ]; then
            echo "FAIL: expected has-custom-patterns to be 'true', got '$HAS_CUSTOM'"
            exit 1
          fi
          echo "PASS"

      - name: Assert paths-output-file exists
        env:
          OUTPUT_FILE: ${{ steps.action.outputs.paths-output-file }}
        run: |
          echo "paths-output-file: $OUTPUT_FILE"
          if [ -z "$OUTPUT_FILE" ]; then
            echo "FAIL: expected paths-output-file to be set"
            exit 1
          fi
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "FAIL: paths-output-file does not exist at: $OUTPUT_FILE"
            exit 1
          fi
          echo "PASS: paths-output-file exists"
